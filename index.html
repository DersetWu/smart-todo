      if (result.confidence === 'low') detail += ' (置信度较低)';

      $previewDetail.textContent = detail;
      $preview.classList.add('show');
    }, 200);
  }

  function formatDate(d) {
    const now = new Date();
    const tomorrow = new Date(now); tomorrow.setDate(tomorrow.getDate() + 1);
    const dayAfter = new Date(now); dayAfter.setDate(dayAfter.getDate() + 2);

    const isToday = now.toDateString() === d.toDateString();
    const isTomorrow = tomorrow.toDateString() === d.toDateString();
    const isDayAfter = dayAfter.toDateString() === d.toDateString();

    const timeStr = d.getHours() > 0 || d.getMinutes() > 0
      ? `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`
      : '';

    if (isToday && timeStr)     return `今天 ${timeStr}`;
    if (isToday)                return '今天';
    if (isTomorrow && timeStr)  return `明天 ${timeStr}`;
    if (isTomorrow)             return '明天';
    if (isDayAfter && timeStr)  return `后天 ${timeStr}`;
    if (isDayAfter)             return '后天';

    const weekNames = ['周日','周一','周二','周三','周四','周五','周六'];
    const dateStr = `${d.getMonth()+1}/${d.getDate()}`;
    return `${dateStr} ${weekNames[d.getDay()]}${timeStr ? ' ' + timeStr : ''}`;
  }

  /* --- Add todo --- */
  function addTodo(text) {
    const trimmed = text.trim();
    if (!trimmed) { toast('⚠️ 请输入内容'); return; }

    const result = Classifier.classify(trimmed);
    const ext = Extractor.extract(trimmed, result.category);
    const now = Date.now();

    const todo = {
      id: now,
      rawText: trimmed,
      title: ext.title,
      text: trimmed,
      done: false,
      createdAt: now,
      category: result.category,
      confidence: result.confidence,
      dueDate: ext.dueDate ? ext.dueDate.toISOString() : null,
      priority: ext.priority,
      timeBlock: ext.timeBlock,
      tags: ext.tags,
      subtasks: ext.subtaskCandidates.map((t, i) => ({ id: now + i + 1, text: t, done: false })),
      estimatedMinutes: ext.estimatedMinutes,
      recurrence: ext.recurrence,
      recurrenceEnd: ext.recurrenceEnd,
      recurrenceInterval: ext.recurrenceInterval,
      reminderPlan: ext.reminderPlan,
      reminderAt: null,
      completedAt: null,
      suggestions: [],
      categoryConfirmed: result.confidence === 'high',
      tagsConfirmed: false,
      acceptedSuggestions: [],
    };

    // AI enhancement: if enabled, confidence low, and Electron available
    if (isAIEnabled() && result.confidence === 'low' && window.electronAPI?.classifyWithAI) {
      todo._aiPending = true;
      // Fire-and-forget: AI runs async, updates todo when done
      (async () => {
        try {
          const aiResult = await window.electronAPI.classifyWithAI(trimmed, result.category);
          if (aiResult && !aiResult.error && aiResult.category) {
            todo.category = aiResult.category;
            todo.confidence = 'high';
            todo.categoryConfirmed = true;
            // If AI suggests subtasks, add them
            if (aiResult.subtasks && aiResult.subtasks.length > 0) {
              todo.subtasks = aiResult.subtasks.map((t, i) => ({ id: now + i + 100, text: t, done: false }));
            }
            // Re-generate suggestions with AI-enhanced classification
            todo.suggestions = Suggestions.generate(todo);
            TodoDB.put(todo);
            render();
            toast('🤖 AI 已优化分类');
          }
        } catch (_) { /* AI failed silently — keep rule-based result */ }
        delete todo._aiPending;
      })();
    }

    // Pre-generate suggestions
    todo.suggestions = Suggestions.generate(todo);

    todos.unshift(todo);
    TodoDB.put(todo);
    autoStartReminder(todo);
    $input.value = '';
    $preview.classList.remove('show');
    render();
    $input.focus();

    // Toast if low confidence
    if (result.confidence === 'low') {
      setTimeout(() => toast('分类不太确定？点击卡片可以切换类型'), 500);
    }
  }

  async function autoStartReminder(t) {
    const raw = t.rawText || t.text || '';
    const shouldAutoStart = Boolean(
      t.reminderPlan ||
      ((t.dueDate || t.recurrence) && /提醒|别忘了?|记住/.test(raw))
    );
    if (!shouldAutoStart || t.done) return;

    try {
      if ('Notification' in window && Notification.permission !== 'granted' && Notification.permission !== 'denied') {
        await Notification.requestPermission();
      }
      const reminderTime = ReminderManager.suggestReminderTime(t);
      if (!reminderTime) {
        t.reminderAt = null;
        await TodoDB.put(t);
        return;
      }
      await ReminderManager.scheduleReminder(t, reminderTime);
      t.suggestions = (t.suggestions || []).filter(s => !['start-recurring', 'set-reminder'].includes(s.id));
      await TodoDB.put(t);
      toast(`🔔 已自动开始提醒 — ${ReminderManager.formatReminderTime(reminderTime)}`);
      render();
    } catch (e) {
      toast(`⚠️ 提醒启动失败：${String(e.message || e).substring(0, 40)}`);
    }
  }

  function markTodoDone(t, done) {
    t.done = Boolean(done);
    t.completedAt = t.done ? (t.completedAt || Date.now()) : null;
  }

  /* --- Actions --- */
  function toggleDone(id) {
    const t = todos.find(x => x.id === id);
    if (!t) return;
    markTodoDone(t, !t.done);
    // Cancel reminder if completing
    if (t.done && t.reminderAt) {
      ReminderManager.cancelReminder(id);
      t.reminderAt = null;
    }
    // Auto-complete subtasks
    if (t.done && t.subtasks) t.subtasks.forEach(s => s.done = true);
    TodoDB.put(t);
    render();
  }

  function deleteTodo(id) {
    // Cancel reminder
    ReminderManager.cancelReminder(id);
    const $card = $list.querySelector(`[data-id="${id}"]`);
    if ($card) {
      $card.classList.add('removing');
      $card.addEventListener('animationend', () => {
        todos = todos.filter(t => t.id !== id);
        TodoDB.remove(id);
        render();
      }, { once: true });
    } else {
      todos = todos.filter(t => t.id !== id);
      TodoDB.remove(id);
      render();
    }
  }

  function updateText(id, newText) {
    const trimmed = newText.trim();
    const t = todos.find(x => x.id === id);
    if (!t) return;
    if (!trimmed) { deleteTodo(id); return; }
    // Re-analyze if text changed significantly
    if (trimmed !== t.rawText) {
      t.rawText = trimmed;
      t.text = trimmed;
      const result = Classifier.classify(trimmed);
      const ext = Extractor.extract(trimmed, result.category);
      t.category = result.category;
      t.confidence = result.confidence;
      t.dueDate = ext.dueDate ? ext.dueDate.toISOString() : null;
      t.priority = ext.priority;
      t.timeBlock = ext.timeBlock;
      t.tags = ext.tags;
      t.subtasks = ext.subtaskCandidates.map((txt, i) => ({ id: Date.now() + i + 1, text: txt, done: false }));
      t.recurrence = ext.recurrence;
      t.recurrenceEnd = ext.recurrenceEnd;
      t.recurrenceInterval = ext.recurrenceInterval;
      t.reminderPlan = ext.reminderPlan;
      t.categoryConfirmed = result.confidence === 'high';
      t.suggestions = Suggestions.generate(t);
      autoStartReminder(t);
    } else {
      t.text = trimmed;
    }
    TodoDB.put(t);
    render();
  }

  function changeCategory(id, newCat) {
    const t = todos.find(x => x.id === id);
    if (!t) return;
    t.category = newCat;
    t.confidence = 'high';
    t.categoryConfirmed = true;
    // Re-extract and re-suggest
    const ext = Extractor.extract(t.rawText, newCat);
    t.dueDate = ext.dueDate ? ext.dueDate.toISOString() : null;
    t.priority = ext.priority;
    t.timeBlock = ext.timeBlock;
    t.tags = ext.tags;
    t.subtasks = ext.subtaskCandidates.map((txt, i) => ({ id: Date.now() + i + 1, text: txt, done: false }));
    t.recurrence = ext.recurrence;
    t.recurrenceEnd = ext.recurrenceEnd;
    t.recurrenceInterval = ext.recurrenceInterval;
    t.reminderPlan = ext.reminderPlan;
    t.suggestions = Suggestions.generate(t);
    autoStartReminder(t);
    TodoDB.put(t);
    render();
    toast('分类已更新');
  }

  function acceptSuggestion(id, sugId, action) {
    const t = todos.find(x => x.id === id);
    if (!t) return;
    t.acceptedSuggestions.push(sugId);

    switch (action) {
      case 'set_due':
        if (t.dueDate) toast(`截止日期已确认：${formatDate(new Date(t.dueDate))}`);
        break;
      case 'set_timeblock':
        toast(`已记录时间段`);
        break;
      case 'set_priority:high':
        t.priority = 'high';
        toast('优先级已设为"高"');
        break;
      case 'set_priority:medium':
        t.priority = 'medium';
        toast('优先级已设为"中"');
        break;
      case 'set_priority:low':
        t.priority = 'low';
        toast('优先级已设为"低"');
        break;
      case 'create_subtasks':
        // Subtasks already created during extraction
        toast(`已创建 ${t.subtasks.length} 个子任务`);
        break;
      case 'confirm_tags':
        t.tagsConfirmed = true;
        toast(`标签已确认：${t.tags.join('、')}`);
        break;
      case 'do_now':
      markTodoDone(t, true);
      toast('👍 已完成！');
        break;
      case 'start_recurring':
        // Start recurring reminder immediately (first fire in 1 min)
        (async () => {
          try {
            if ('Notification' in window && Notification.permission !== 'granted' && Notification.permission !== 'denied') {
              await Notification.requestPermission();
            }
            const now = new Date();
            const firstReminder = new Date(now.getTime() + 60 * 1000); // 1 minute from now
            await ReminderManager.scheduleReminder(t, firstReminder);
            t.suggestions = t.suggestions.filter(s => s.id !== sugId);
            await TodoDB.put(t);
            const recNames = { minutely: '每分钟', hourly: '每小时', daily: '每天', weekly: '每周' };
            toast(`🔄 已开始${recNames[t.recurrence] || ''}提醒`);
            render();
          } catch (e) {
            toast(`⚠️ 提醒启动失败：${String(e.message || e).substring(0, 60)}`);
          }
        })();
        return;
      case 'set_reminder':
        (async () => {
          // Request notification permission
          if ('Notification' in window && Notification.permission !== 'granted' && Notification.permission !== 'denied') {
            await Notification.requestPermission();
          }
          const reminderTime = ReminderManager.suggestReminderTime(t);
          await ReminderManager.scheduleReminder(t, reminderTime);
          t.suggestions = t.suggestions.filter(s => s.id !== sugId);
          TodoDB.put(t);
          toast(`🔔 已设置提醒 — ${ReminderManager.formatReminderTime(reminderTime)}`);
          render();
        })();
        return; // async — exit early, callback handles render
      case 'do_now':
      default:
        break;
    }

    // Remove accepted suggestion from list
    t.suggestions = t.suggestions.filter(s => s.id !== sugId);
    TodoDB.put(t);
    render();
  }

  function dismissSuggestion(id, sugId) {
    const t = todos.find(x => x.id === id);
    if (!t) return;
    t.suggestions = t.suggestions.filter(s => s.id !== sugId);
    TodoDB.put(t);
    render();
  }

  function toggleSubtask(todoId, subId) {
    const t = todos.find(x => x.id === todoId);
    if (!t) return;
    const sub = t.subtasks.find(s => s.id === subId);
    if (!sub) return;
    sub.done = !sub.done;
    TodoDB.put(t);
    render();
  }

  function addFirstStep(todoId) {
    const t = todos.find(x => x.id === todoId);
    if (!t) return;
    const stepId = Date.now();
    t.subtasks.push({ id: stepId, text: '第一步：明确目标', done: false });
    t.suggestions = t.suggestions.filter(s => s.id !== 'add_first_step');
    TodoDB.put(t);
    render();
    // Focus the new subtask for editing
    setTimeout(() => {
      const $subText = $list.querySelector(`[data-sub-id="${stepId}"] .subtask-text`);
      if ($subText) {
        $subText.contentEditable = 'true';
        $subText.focus();
        document.getSelection().selectAllChildren($subText);
      }
    }, 300);
  }

  /* --- Reminder modal --- */
  // Expose for cross-module access
  window._showReminderModal = function(todo) {
    currentReminderTodo = todo;
    const popup = $reminderModal.querySelector('.reminder-popup');
    popup.classList.remove('bubble-style', 'bubble-pink', 'bubble-lavender');
    if (reminderStyle === 'pink-bubble') popup.classList.add('bubble-style', 'bubble-pink');
    if (reminderStyle === 'lavender-bubble') popup.classList.add('bubble-style', 'bubble-lavender');
    // Use generated title, fall back to text
    const title = todo.title && todo.title !== todo.text ? todo.title : todo.text;
    document.querySelector('#reminderModal h2').textContent = title;
    $reminderText.textContent = '';
    $reminderMeta.textContent = '';
    $btnDoneReminder.hidden = !shouldShowReminderDoneButton(todo);
    $reminderModal.classList.add('show');
  };

  function shouldShowReminderDoneButton(todo) {
    if (!todo) return false;
    if (!todo.recurrence && !todo.reminderPlan) return true;
    return isFinalReminderOccurrence(todo);
  }

  function isFinalReminderOccurrence(todo) {
    if (!todo.recurrenceEnd && !todo.reminderPlan?.until) return false;
    const reminderAt = todo.reminderAt ? new Date(todo.reminderAt) : new Date();
    const afterCurrent = new Date(reminderAt.getTime() + 1000);

    if (todo.reminderPlan) {
      return !ReminderManager.computeNextReminderTime(todo, afterCurrent);
    }

    const next = getNextClassicRecurrenceTime(todo, afterCurrent);
    if (!next) return true;
    return todo.recurrenceEnd ? next > new Date(todo.recurrenceEnd) : false;
  }

  function getNextClassicRecurrenceTime(todo, fromDate) {
    const interval = Math.max(1, Number(todo.recurrenceInterval) || 1);
    const last = todo.reminderAt ? new Date(todo.reminderAt) : fromDate;
    switch (todo.recurrence) {
      case 'minutely': return addMinutesForApp(last, interval);
      case 'hourly': return addMinutesForApp(last, interval * 60);
      case 'daily': return addDaysForApp(last, interval);
      case 'weekly': return addDaysForApp(last, interval * 7);
      default: return null;
    }
  }

  function addMinutesForApp(date, minutes) {
    const d = new Date(date);
    d.setMinutes(d.getMinutes() + minutes);
    return d;
  }

  function addDaysForApp(date, days) {
    const d = new Date(date);
    d.setDate(d.getDate() + days);
    return d;
  }

  function showReminderModal(todo) {
    window._showReminderModal(todo);
  }

  function clearCompleted() {
    const completedIds = todos.filter(t => t.done).map(t => t.id);
    if (!completedIds.length) return;
    todos = todos.filter(t => !t.done);
    completedIds.forEach(id => TodoDB.remove(id));
    render();
    toast(`已清除 ${completedIds.length} 项已完成任务`);
  }

  function exportHistory() {
    const history = todos
      .filter(t => t.done)
      .slice()
      .sort((a, b) => getCompletedTime(b) - getCompletedTime(a))
      .map(t => ({
        id: t.id,
        title: t.title,
        text: t.text,
        category: t.category,
        priority: t.priority,
        createdAt: t.createdAt,
        completedAt: t.completedAt || null,
        reminderAt: t.reminderAt || null,
        reminderPlan: t.reminderPlan || null,
      }));
    if (!history.length) { toast('暂无可导出的历史完成项'); return; }
    const blob = new Blob([JSON.stringify(history, null, 2)], { type: 'application/json;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    const stamp = new Date().toISOString().slice(0, 10);
    a.href = url;
    a.download = `smart-todo-history-${stamp}.json`;
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);
    toast(`已导出 ${history.length} 条历史完成项`);
  }

  /* --- Filter --- */
  function setFilter(filter) {
    currentFilter = filter;
    $$('.filter-btn').forEach(b => b.classList.toggle('active', b.dataset.filter === filter));
    render();
  }

  function getFilteredTodos() {
    const visible = todos.filter(isVisibleInSmartTodo);
    const source = currentFilter === 'completed' ? visible.filter(t => t.done) : visible;
    let result;
    switch (currentFilter) {
      case 'active':    result = source.filter(t => !t.done); break;
      case 'completed': result = source; break;
      case 'quick':     result = source.filter(t => t.category === 'quick'); break;
      case 'planning':  result = source.filter(t => t.category === 'planning'); break;
      case 'system':    result = source.filter(t => t.category === 'system'); break;
      default:          result = source; break;
    }
    return result.sort(compareTodosForDisplay);
  }

  function isVisibleInSmartTodo(t) {
    if (!t.done) return true;
    return Date.now() - getCompletedTime(t) < 3 * 24 * 60 * 60 * 1000;
  }

  function compareTodosForDisplay(a, b) {
    if (a.done !== b.done) return a.done ? 1 : -1;
    if (a.done) return getCompletedTime(b) - getCompletedTime(a);
    const timeDiff = getDisplayTime(a) - getDisplayTime(b);
    if (timeDiff !== 0) return timeDiff;
    const priorityDiff = getPriorityRank(b.priority) - getPriorityRank(a.priority);
    if (priorityDiff !== 0) return priorityDiff;
    return Number(b.createdAt || b.id) - Number(a.createdAt || a.id);
  }

  function getDisplayTime(t) {
    const candidates = [];
    if (t.reminderAt) candidates.push(new Date(t.reminderAt).getTime());
    if (t.dueDate) candidates.push(new Date(t.dueDate).getTime());
    if (t.reminderPlan) {
      const next = ReminderManager.computeNextReminderTime(t, new Date());
      if (next) candidates.push(next.getTime());
    }
    const valid = candidates.filter(Number.isFinite);
    return valid.length ? Math.min(...valid) : Number.MAX_SAFE_INTEGER;
  }

  function getPriorityRank(priority) {
    return { high: 3, medium: 2, low: 1 }[priority] || 0;
  }

  function getCompletedTime(t) {
    return Number(t.completedAt || t.updatedAt || t.createdAt || t.id || 0);
  }

  /* --- Render --- */
  function render() {
    const filtered = getFilteredTodos();
    const activeCount = todos.filter(t => !t.done).length;

    // Stats
    statQuick.textContent    = todos.filter(t => t.category === 'quick' && !t.done).length;
    statPlanning.textContent = todos.filter(t => t.category === 'planning' && !t.done).length;
    statSystem.textContent   = todos.filter(t => t.category === 'system' && !t.done).length;
    $count.textContent = `${activeCount} 项待办`;
    $clear.style.visibility = todos.some(t => t.done) ? 'visible' : 'hidden';
    $exportHistory.style.visibility = todos.some(t => t.done) ? 'visible' : 'hidden';

    // Empty state
    if (filtered.length === 0) {
      const msgs = {
        all:       { icon: '🎉', title: '空空如也', desc: '在上方输入你要做的事情试试看' },
        quick:     { icon: '🏃', title: '没有碎片任务', desc: '买菜、取快递、回邮件……记下来就不怕忘' },
        planning:  { icon: '📅', title: '没有规划任务', desc: '会议、截止日、约会……带时间的任务放这里' },
        system:    { icon: '🏗️', title: '没有项目任务', desc: '多步骤的复杂任务会自动识别到这里' },
        active:    { icon: '✅', title: '全部完成了！', desc: '干得漂亮，给自己一点奖励 🎉' },
        completed: { icon: '📋', title: '还没有完成的任务', desc: '开始完成第一件事吧' },
      };
      const m = msgs[currentFilter] || msgs.all;
      $list.innerHTML = `<li class="empty-state">
        <span class="empty-icon">${m.icon}</span>
        <div class="empty-title">${m.title}</div>
        <div class="empty-desc">${m.desc}</div>
      </li>`;
      return;
    }

    const catNames = { quick: '碎片', planning: '规划', system: '项目' };
    const catEmoji = { quick: '🏃', planning: '📅', system: '🏗️' };
    const catClass = { quick: 'quick', planning: 'planning', system: 'system' };
    const prioNames = { high: '高优先', medium: '中优先', low: '低优先' };
    const prioClass = { high: 'pri-high', medium: 'pri-medium', low: 'pri-low' };
    const timeBlockNames = { morning: '上午', noon: '中午', afternoon: '下午', evening: '傍晚', night: '晚上' };

    $list.innerHTML = filtered.map(t => {
      const dueDate = t.dueDate ? new Date(t.dueDate) : null;
      const isOverdue = dueDate && dueDate < new Date() && !t.done;
      const suggestHTML = renderSuggestions(t);
      const confidenceHTML = (!t.categoryConfirmed && t.confidence === 'low')
        ? renderConfidenceToggle(t) : '';

      // Generate subtask HTML
      let subtaskHTML = '';
      if (t.subtasks && t.subtasks.length > 0) {
        subtaskHTML = `<ul class="subtasks">${t.subtasks.map(s => `
          <li class="subtask-item${s.done ? ' done' : ''}" data-sub-id="${s.id}">
            <div class="sub-check"></div>
            <span class="subtask-text" contenteditable="false">${escHTML(s.text)}</span>
          </li>
        `).join('')}</ul>`;
      }

      return `
      <li class="todo-card${t.done ? ' done' : ''}" data-id="${t.id}">
        <div class="card-main">
          <div class="checkbox" role="checkbox" aria-checked="${t.done}" tabindex="0"></div>
          <div class="card-body">
            <span class="task-text" contenteditable="false">${escHTML(t.text)}</span>
            <div class="card-meta">
              <span class="meta-tag cat-badge ${catClass[t.category]}">${catEmoji[t.category]} ${catNames[t.category]}</span>
              ${dueDate ? `<span class="meta-tag due-tag${isOverdue ? ' overdue' : ''}">📅 ${formatDate(dueDate)}${isOverdue ? ' ⚠️已过期' : ''}</span>` : ''}
              ${t.priority ? `<span class="meta-tag ${prioClass[t.priority]}">🚩 ${prioNames[t.priority]}</span>` : ''}
              ${t.timeBlock ? `<span class="meta-tag time-tag">⏰ ${timeBlockNames[t.timeBlock]}</span>` : ''}
              ${t.tags.map(tag => `<span class="meta-tag tag-tag">#${tag}</span>`).join('')}
              ${t.reminderAt ? `<span class="meta-tag time-tag" data-reminder-id="${t.id}" title="点击取消/修改提醒">🔔 ${ReminderManager.formatReminderTime(new Date(t.reminderAt))} · 点击取消</span>` : ''}
              ${t.reminderPlan ? `<span class="meta-tag time-tag">🔄 ${escHTML(ReminderManager.formatReminderPlan(t.reminderPlan))}</span>` : ''}
              ${!t.reminderPlan && t.recurrence ? `<span class="meta-tag time-tag">🔄 ${({minutely:'每分钟',hourly:'每小时',daily:'每天',weekly:'每周',custom:'自定义'})[t.recurrence] || t.recurrence}${t.recurrenceInterval > 1 ? '×'+t.recurrenceInterval : ''}</span>` : ''}
              ${t.subtasks && t.subtasks.length > 0 ? `<span class="meta-tag tag-tag">📋 ${t.subtasks.filter(s=>s.done).length}/${t.subtasks.length} 子任务</span>` : ''}
            </div>
          </div>
          <button class="delete-card-btn" title="删除">🗑</button>
        </div>
        ${confidenceHTML}
        ${subtaskHTML}
        ${suggestHTML}
      </li>`;
    }).join('');
  }

  function renderSuggestions(t) {
    if (!t.suggestions || t.suggestions.length === 0) return '';
    // Show only first 2 suggestions
    const toShow = t.suggestions.slice(0, 2);
    return toShow.map(s => `
      <div class="suggestion-box show" data-sug-id="${s.id}">
        <span class="sug-icon">${escHTML(s.icon)}</span>
        <span class="sug-text">${escHTML(s.text)}</span>
        <div class="sug-actions">
          <button class="sug-btn sug-accept" data-action="${escAttr(s.action)}" data-sug-id="${escAttr(s.id)}">${escHTML(s.actionLabel)}</button>
          <button class="sug-btn sug-dismiss" data-sug-id="${escAttr(s.id)}">忽略</button>
        </div>
      </div>
    `).join('');
  }

  function renderConfidenceToggle(t) {
    const cats = ['quick', 'planning', 'system'];
    const names = { quick: '碎片', planning: '规划', system: '项目' };
    const others = cats.filter(c => c !== t.category);
    return `
      <div class="confidence-toggle show">
        <span>分类不确定？切换为：</span>
        ${others.map(c => `<button class="conf-toggle-btn" data-change-cat="${c}">${names[c]}</button>`).join('')}
      </div>
    `;
  }

  function escHTML(str) {
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  function escAttr(value) {
    return escHTML(String(value)).replace(/`/g, '&#96;');
  }

  /* --- Event binding --- */
  function bindEvents() {
    // Submit
    $form.addEventListener('submit', e => {
      e.preventDefault();
      try {
        addTodo($input.value);
      } catch (err) {
        console.error('addTodo error:', err);
        toast('❌ 出错了：' + err.message);
      }
    });

    // Live preview while typing
    $input.addEventListener('input', updatePreview);

    // Card interactions (click delegation)
    $list.addEventListener('click', e => {
      const $card = e.target.closest('.todo-card');
      if (!$card) return;
      const id = Number($card.dataset.id);

      // Checkbox
      if (e.target.closest('.checkbox') || e.target.closest('.sub-check')) {
        // Sub-check
        const $sub = e.target.closest('.subtask-item');
        if ($sub) {
          const subId = Number($sub.dataset.subId);
          toggleSubtask(id, subId);
          return;
        }
        toggleDone(id);
        return;
      }

      // Delete
      if (e.target.closest('.delete-card-btn')) {
        deleteTodo(id);
        return;
      }

      // Suggestion accept
      if (e.target.closest('.sug-accept')) {
        const $btn = e.target.closest('.sug-accept');
        const sugId = $btn.dataset.sugId;
        const action = $btn.dataset.action;

        if (action === 'add_first_step') {
          addFirstStep(id);
          return;
        }

        acceptSuggestion(id, sugId, action);
        return;
      }

      // Suggestion dismiss
      if (e.target.closest('.sug-dismiss')) {
        const sugId = e.target.closest('.sug-dismiss').dataset.sugId;
        dismissSuggestion(id, sugId);
        return;
      }

      // Reminder indicator click → cancel or change
      if (e.target.closest('[data-reminder-id]')) {
        e.preventDefault();
        const rId = Number(e.target.closest('[data-reminder-id]').dataset.reminderId);
        const t = todos.find(x => x.id === rId);
        if (!t) return;
        ReminderManager.cancelReminder(rId);
        t.reminderAt = null;
        TodoDB.put(t);
        toast('🔕 提醒已取消');
        render();
        return;
      }

      // Confidence toggle
      if (e.target.closest('.conf-toggle-btn')) {
        const newCat = e.target.closest('.conf-toggle-btn').dataset.changeCat;
        changeCategory(id, newCat);
        return;
      }
    });

    // Double-click to edit task text
    $list.addEventListener('dblclick', e => {
      const $text = e.target.closest('.task-text');
      if (!$text || $text.contentEditable === 'true') return;
      const $card = $text.closest('.todo-card');
      const id = Number($card.dataset.id);

      $text.contentEditable = 'true';
      $text.focus();
      const sel = window.getSelection();
      sel.removeAllRanges();
      const range = document.createRange();
      range.selectNodeContents($text);
      sel.addRange(range);
    });

    // Double-click to edit subtask text
    $list.addEventListener('dblclick', e => {
      const $text = e.target.closest('.subtask-text');
      if (!$text || $text.contentEditable === 'true') return;
      const $sub = $text.closest('.subtask-item');
      const subId = Number($sub.dataset.subId);
      const $card = $sub.closest('.todo-card');
      const todoId = Number($card.dataset.id);

      $text.contentEditable = 'true';
      $text.focus();
      const sel = window.getSelection();
      sel.removeAllRanges();
      const range = document.createRange();
      range.selectNodeContents($text);
      sel.addRange(range);

      // Store for blur handler
      $text._todoId = todoId;
      $text._subId = subId;
    });

    // Finish editing task text on blur
    $list.addEventListener('blur', e => {
      const $text = e.target.closest('.task-text');
      if ($text && $text.contentEditable === 'true') {
        $text.contentEditable = 'false';
        const $card = $text.closest('.todo-card');
        if ($card) updateText(Number($card.dataset.id), $text.textContent);
      }

      // Subtask text
      const $subText = e.target.closest('.subtask-text');
      if ($subText && $subText.contentEditable === 'true') {
        $subText.contentEditable = 'false';
        const todoId = $subText._todoId;
        const subId = $subText._subId;
        if (todoId && subId) {
          const t = todos.find(x => x.id === todoId);
          if (t) {
            const sub = t.subtasks.find(s => s.id === subId);
            if (sub) {
              const trimmed = $subText.textContent.trim();
              if (trimmed) sub.text = trimmed;
              else t.subtasks = t.subtasks.filter(s => s.id !== subId);
              TodoDB.put(t);
              render();
            }
          }
        }
      }
    }, true);

    // Keyboard: Enter to finish edit, Esc to cancel
    $list.addEventListener('keydown', e => {
      const $text = e.target.closest('.task-text, .subtask-text');
      if (!$text || $text.contentEditable !== 'true') return;

      if (e.key === 'Enter') { e.preventDefault(); $text.blur(); }
      if (e.key === 'Escape') {
        e.preventDefault();
        $text.contentEditable = 'false';
        render(); // Re-render to restore original text
      }
    });

    // Keyboard: checkbox with space/enter
    $list.addEventListener('keydown', e => {
      const $cb = e.target.closest('.checkbox');
      if (!$cb || (e.key !== 'Enter' && e.key !== ' ')) return;
      e.preventDefault();
      const $card = $cb.closest('.todo-card');
      toggleDone(Number($card.dataset.id));
    });

    // Filters
    $filters.addEventListener('click', e => {
      const btn = e.target.closest('.filter-btn');
      if (!btn) return;
      setFilter(btn.dataset.filter);
    });

    // Clear completed
    $clear.addEventListener('click', clearCompleted);
    $exportHistory.addEventListener('click', exportHistory);

    // Theme
    $themeBtn.addEventListener('click', toggleTheme);

    // Settings panel
    loadAIConfig();
    $settingsBtn.addEventListener('click', () => { $settingsModal.classList.add('show'); });
    $btnCancelSettings.addEventListener('click', () => { $settingsModal.classList.remove('show'); });
    $aiToggle.addEventListener('change', () => {
      const on = $aiToggle.checked;
      $aiConfigSection.classList.toggle('show', on);
      $btnTestAI.style.display = on ? '' : 'none';
    });
    $btnSaveSettings.addEventListener('click', saveAIConfig);
    $btnTestAI.addEventListener('click', testAIConnection);
    // Close on overlay click
    $settingsModal.addEventListener('click', (e) => {
      if (e.target === $settingsModal) $settingsModal.classList.remove('show');
    });

    // Reminder modal buttons
    $btnDoneReminder.addEventListener('click', () => {
      if (currentReminderTodo) {
        markTodoDone(currentReminderTodo, true);
        TodoDB.put(currentReminderTodo);
        toast('✅ 已完成');
      }
      $reminderModal.classList.remove('show');
      currentReminderTodo = null;
      render();
    });
    $btnSnooze.addEventListener('click', () => {
      if (currentReminderTodo) {
        const snoozeTime = new Date(Date.now() + 10 * 60 * 1000);
        ReminderManager.scheduleReminder(currentReminderTodo, snoozeTime);
        toast('⏰ 10 分钟后再提醒');
      }
      $reminderModal.classList.remove('show');
      currentReminderTodo = null;
      render();
    });
    $btnCloseReminder.addEventListener('click', () => {
      $reminderModal.classList.remove('show');
      currentReminderTodo = null;
    });
    $reminderModal.addEventListener('click', (e) => {
      if (e.target === $reminderModal) {
        $reminderModal.classList.remove('show');
        currentReminderTodo = null;
      }
    });

    // PWA install — try system prompt first, fall back to manual guide
    $installBtn.addEventListener('click', async () => {
      if (deferredPrompt) {
        deferredPrompt.prompt();
        const result = await deferredPrompt.userChoice;
        deferredPrompt = null;
      } else {
        // No beforeinstallprompt — show manual guide via toast
        toast('💡 Chrome/Edge：点击地址栏右侧的安装图标 📥 即可安装到桌面');
      }
      $installBanner.classList.remove('show');
      await TodoDB.setMeta('installBannerDismissed', true);
    });
    $installDismiss.addEventListener('click', async () => {
      $installBanner.classList.remove('show');
      await TodoDB.setMeta('installBannerDismissed', true);
    });

    // Test button
    $testBtn.addEventListener('click', runTests);

    // Keyboard shortcut: Ctrl+Enter to submit from anywhere
    document.addEventListener('keydown', e => {
      if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
        e.preventDefault();
        addTodo($input.value);
      }
    });
  }

  /* --- Test suite --- */
  async function runTests() {
    const cases = [
      ['买牛奶', 'quick'], ['下班路上寄快递', 'quick'], ['给物业打电话问停车位', 'quick'],
      ['明天下午3点开会', 'planning'], ['周五前提交周报', 'planning'], ['今天下班去健身房', 'planning'],
      ['明天上午10点和客户电话沟通需求', 'planning'], ['下周一之前完成Q3数据分析报告', 'planning'],
      ['重构用户认证模块', 'system'], ['准备年度总结PPT，需要收集数据、做图表、写演讲稿', 'system'],
      ['整理书房，把书分类、不需要的处理掉、重新排列', 'system'],
      ['学习Rust语言，看完官方教程前5章并做练习', 'system'],
      ['还信用卡', 'quick'], ['取快递', 'quick'], ['明晚8点和朋友吃饭', 'planning'],
      ['下周完成项目技术方案设计，涉及架构选型、接口定义、数据库设计', 'system'],
      ['买周末露营的食材：牛肉、鸡翅、蔬菜、饮料、零食', 'quick'],
      ['今天整理这周的工作笔记', 'planning'], ['紧急：服务器证书过期了，马上续期', 'planning'],
      ['给团队分享上月踩过的坑，准备一个内部技术分享PPT', 'system'],
      ['回复老板的邮件', 'quick'], ['明天去医院体检，记得空腹', 'planning'],
      ['报名参加9月的技术大会', 'planning'], ['优化首页加载速度，目标从3秒降到1秒以内', 'system'],
      ['交电费', 'quick'], ['预约牙医洗牙', 'quick'], ['下午4点面试候选人', 'planning'],
      ['本周五之前和设计师对齐新版本UI规范', 'planning'],
      ['制定团队下半年OKR，要和老板对齐、和每个成员沟通、输出文档', 'system'],
      ['写一篇关于微服务架构的博客，需要结合项目实际案例', 'system'],
    ];

    let correct = 0;
    const classificationErrors = [];
    const errors = [];

    cases.forEach(([text, expected]) => {
      const result = Classifier.classify(text);
      if (result.category === expected) {
        correct++;
      } else {
        classificationErrors.push(`⚠️ "${text}" → 预期 ${expected}，实际 ${result.category} (${result.scores.quick}/${result.scores.planning}/${result.scores.system})`);
      }
    });

    const reminderCases = [
      ['每天9:30~18:00（工作日），每小时提醒我测试事项甲', '测试事项甲', 'time-window'],
      ['每天9:30~18:00（工作日），每半小时提醒我测试事项乙', '测试事项乙', 'time-window'],
      ['每天18:00（工作日），每小时提醒我测试事项丙', '测试事项丙', 'fixed-time'],
      ['每天17:45（工作日），每小时提醒我测试事项丁', '测试事项丁', 'fixed-time'],
    ];
    reminderCases.forEach(([text, title, planType]) => {
      const result = Extractor.extract(text, 'quick');
      if (result.title !== title || result.reminderPlan?.type !== planType || !result.reminderPlan.weekdaysOnly) {
        errors.push(`❌ 提醒解析失败：${text}`);
      }
    });

    let ipcPassed = Boolean(window.electronAPI?.scheduleReminder && window.electronAPI?.cancelReminder);
    if (window.electronAPI?.scheduleReminder && window.electronAPI?.cancelReminder) {
      const testTodo = {
        id: Number.MAX_SAFE_INTEGER - 1,
        text: '页面提醒自检',
        title: '页面提醒自检',
        recurrence: 'minutely',
        recurrenceInterval: 1,
      };
      try {
        await ReminderManager.scheduleReminder(testTodo, new Date(Date.now() + 60 * 1000));
        ReminderManager.cancelReminder(testTodo.id);
        await TodoDB.remove(testTodo.id);
      } catch (e) {
        ipcPassed = false;
        errors.push(`❌ Electron 提醒排程失败：${String(e.message || e).substring(0, 60)}`);
      }
    } else {
      errors.push('❌ Electron 提醒接口未注入，排程自检未执行');
    }

    const pct = Math.round(correct / cases.length * 100);
    const reminderPassed = reminderCases.length - errors.filter(e => e.includes('提醒解析')).length;
    const classificationPassed = pct >= 80;
    const allPassed = classificationPassed && errors.length === 0 && ipcPassed;
    const msg = `${allPassed ? '✅ 页面自检通过' : '❌ 页面自检失败'}：分类 ${correct}/${cases.length}（${pct}%），提醒解析 ${reminderPassed}/${reminderCases.length}，排程 ${ipcPassed ? '通过' : '失败'}`;
    toast(msg, 'test-result');

    if (classificationErrors.length > 0) {
      console.log('=== 分类偏差 ===');
      classificationErrors.forEach(e => console.log(e));
    }
    if (errors.length > 0) {
      console.log('=== 提醒自检错误 ===');
      errors.forEach(e => console.log(e));
    }
    console.log(`=== 准确率: ${pct}% ===`);
  }

  return { init };
})();

// Boot
document.addEventListener('DOMContentLoaded', () => {
  App.init();
});
</script>
</body>
</html>
